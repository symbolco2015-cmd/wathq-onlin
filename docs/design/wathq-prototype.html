<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وثّق — المحاكي الموحّد</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.app{--bg:#0b0f0d;--s1:#121715;--s2:#181e1b;--s3:#1f2622;--bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.14);
--t1:#eef2ef;--t2:#b3bdb7;--t3:#8a958f;--accent:#3ecf7a;--on-accent:#04210f;--ok-bg:rgba(62,207,122,.12);
--gold:#d9b44a;--gold-bg:rgba(217,180,74,.13);--prog:#c9d3cd;--idle:#4a544f;--warn:#e8a33d;--warn-bg:rgba(232,163,61,.12);
--danger:#f16b6b;--danger-bg:rgba(241,107,107,.1);--info:#6fb3f0;--info-bg:rgba(111,179,240,.12);
--brand:#0A2E1F;--bgold:#C9A24A;--cream:#F7F5EF;--r-sm:10px;--r-md:16px;--r-lg:24px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:#030605;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 10px 40px;gap:10px}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
small{font-size:12px}
svg.ic{width:1em;height:1em;flex-shrink:0;display:inline-block;vertical-align:-.125em}
/* شريط التحكم (خارج المحاكي) */
.ctrl{background:#0d1210;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:9px 12px;display:flex;gap:12px;align-items:center;font-size:12px;color:#b3bdb7;flex-wrap:wrap;justify-content:center;max-width:1280px}
.ctrl .g{display:flex;gap:7px;align-items:center}
.seg{display:flex;background:#050807;border-radius:10px;padding:3px;gap:2px}
.seg button{font-size:12px;padding:6px 10px;border-radius:10px;color:#8a958f;font-weight:700;white-space:nowrap}
.seg button.on{background:#2a7a44;color:#fff}
.rb{font-size:12px;padding:7px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.16);font-weight:700;color:#eef2ef;display:flex;gap:6px;align-items:center}
.hint{font-size:12px;color:#8a958f;text-align:center;max-width:900px;line-height:1.7}

.app{position:relative;overflow:hidden;background:var(--bg);color:var(--t1);border:1px solid rgba(255,255,255,.12)}
.app.desk{width:100%;max-width:1320px;height:860px;border-radius:16px}
.app.mob{width:390px;max-width:100%;height:844px;border-radius:32px}
.layer{position:absolute;inset:0}
.scroll{overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.muted{color:var(--t3)}
.btn{height:44px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--bd2);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;background:rgba(255,255,255,.02)}
.btn:hover{border-color:rgba(255,255,255,.26)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn.gh{border-color:transparent;background:none;color:var(--t2)}
.btn.dng{color:var(--danger);border-color:rgba(241,107,107,.35)}
.btn.dngf{background:var(--danger);color:#2a0606;border-color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.icb{width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--t2);position:relative;flex-shrink:0}
.icb.sm{width:36px;height:36px;font-size:16px;border-radius:10px}
.icb .dot{position:absolute;top:8px;left:9px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--bg)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-md);padding:16px}
.h{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.h small{font-weight:400;font-size:12px;color:var(--t3);margin-right:auto}
.meter{height:6px;border-radius:999px;background:var(--s3);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.n{color:var(--t3);background:rgba(255,255,255,.04)}.pill.p{color:var(--prog);background:rgba(255,255,255,.06)}.pill.g{color:var(--accent);background:var(--ok-bg)}.pill.x{color:var(--gold);background:var(--gold-bg)}
.pill.w{color:var(--warn);background:var(--warn-bg)}.pill.d{color:var(--danger);background:var(--danger-bg)}.pill.i{color:var(--info);background:var(--info-bg)}
.dots{display:flex;gap:3px}.dots i{width:18px;height:4px;border-radius:999px;background:var(--idle)}.dots i.p{background:var(--prog)}.dots i.g{background:var(--accent)}.dots i.x{background:var(--gold)}
.fadein{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeo{from{opacity:0}}
.toast{position:absolute;z-index:40;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#eef2ef;color:#0b1a11;font-size:14px;font-weight:700;padding:10px 14px;border-radius:10px;opacity:0;transition:.25s;white-space:nowrap;pointer-events:none;display:flex;gap:12px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{color:#136b37;font-weight:700;font-size:14px}

/* ===== شاشة البداية ===== */
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(70% 50% at 50% 40%,#124a31 0%,#0A2E1F 65%);color:var(--cream);z-index:30;transition:opacity .35s}
.splash.out{opacity:0;pointer-events:none}
.logo{width:116px;animation:breathe 2.4s ease-in-out infinite}.logo svg{display:block;width:100%;height:auto}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.splash .tag{font-size:14px;color:rgba(247,245,239,.62);margin-top:14px}
.bar{width:132px;height:3px;border-radius:999px;background:rgba(247,245,239,.12);margin-top:26px;overflow:hidden;position:relative}
.bar i{position:absolute;top:0;bottom:0;width:40%;border-radius:999px;background:var(--bgold);animation:ind 1.25s cubic-bezier(.4,0,.2,1) infinite}
@keyframes ind{0%{right:-40%}100%{right:100%}}
.slow{font-size:14px;color:rgba(247,245,239,.8);margin-top:16px;min-height:20px;opacity:0;transition:opacity .4s}.slow.on{opacity:1}
.fail{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 32px;animation:fade .3s}
.fail .fi{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:28px}
.fail h2{font-size:20px;margin-top:18px}.fail p{font-size:14px;color:rgba(247,245,239,.78);margin-top:6px;line-height:1.8;max-width:300px}
.fail small{font-size:12px;color:rgba(247,245,239,.55);margin-top:12px}
.sk{background:linear-gradient(90deg,var(--s2) 0%,#232b27 45%,var(--s2) 90%);background-size:220% 100%;animation:shim 1.3s linear infinite;border-radius:10px}
@keyframes shim{0%{background-position:120% 0}100%{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){.logo,.sk{animation:none}}

/* ===== تطبيق المعلم ===== */
.top{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;padding:11px 14px;background:rgba(11,15,13,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.desk .top{padding:12px 26px}
.brandm{display:flex;align-items:center;gap:7px;font-weight:700;font-size:16px}
.brandm .mk{height:28px;display:flex}.brandm .mk svg{height:28px;width:auto}
.top .sp{flex:1}
.ava{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1c3a2a,#274d38);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--cream);flex-shrink:0}
.urg{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--danger-bg);border-bottom:1px solid rgba(241,107,107,.25);font-size:14px;color:#ffd1d1}
.urg b{flex:1}
.wrap{padding:14px 14px 90px}
.desk .wrap{padding:22px 26px 40px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.aside{display:flex;flex-direction:column;gap:12px;position:sticky;top:78px}
.mob .aside{display:none}
.hello{font-size:14px;color:var(--t3)}.hello b{display:block;font-size:20px;color:var(--t1);margin-top:1px}
.month .n{font-size:28px;font-weight:700;margin-top:4px;line-height:1.2}.month .n small{font-size:14px;color:var(--t3);font-weight:400}
.month .meter{margin-top:10px}
.month .nx{font-size:12px;color:var(--t3);margin-top:8px}
.cum{display:flex;align-items:center;gap:14px}
.cum .rg{width:58px;height:58px;flex-shrink:0;position:relative}
.cum .rg b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.cum p{font-size:12px;color:var(--t3);margin-top:2px;line-height:1.6}
.pend{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--s1);border:1px solid var(--bd)}
.pend .pi{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--s2);color:var(--t2)}
.pend b{font-size:14px;display:block}.pend small{font-size:12px;color:var(--t3)}
.pend .btn{margin-right:auto}
.pend.ai{background:linear-gradient(135deg,rgba(217,180,74,.08),rgba(62,207,122,.04)),var(--s1);border-color:rgba(217,180,74,.25)}
.pend.ai .pi{background:var(--gold-bg);color:var(--gold)}
.lbl{font-size:14px;font-weight:700;color:var(--t2);margin:6px 2px 0;display:flex;align-items:center;gap:8px}
.lbl small{font-weight:400;color:var(--t3);font-size:12px}
.secr{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:right;border-radius:16px;background:var(--s1);border:1px solid var(--bd);transition:border-color .15s}
.secr:hover{border-color:var(--bd2)}
.tile{width:40px;height:40px;border-radius:10px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--t2);flex-shrink:0}
.secr b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secr .dots{margin-top:6px}
.secr .end{margin-right:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.list{display:flex;flex-direction:column;gap:8px}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spec .secr{flex-direction:column;align-items:flex-start;gap:8px}
.spec .secr b{white-space:normal;font-size:14px;line-height:1.5}
.spec small{font-size:12px;color:var(--t3)}
.fab{position:absolute;z-index:7;left:18px;bottom:22px;height:56px;padding:0 20px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 28px rgba(62,207,122,.3)}
.desk .fab{display:none}
.navs{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.navs button{display:flex;align-items:center;gap:9px;padding:8px 8px;border-radius:10px;font-size:14px;color:var(--t2);text-align:right}
.navs button:hover{background:rgba(255,255,255,.04)}
.navs button.on{background:var(--s2);color:var(--t1)}
.navs .dt{width:8px;height:8px;border-radius:50%;background:var(--idle);flex-shrink:0}
.navs .dt.p{background:var(--prog)}.navs .dt.g{background:var(--accent)}.navs .dt.x{background:var(--gold)}

/* الترحيب */
.wel{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:18px;background:linear-gradient(160deg,rgba(62,207,122,.14),rgba(62,207,122,.03) 55%),var(--s1);border:1px solid rgba(62,207,122,.28)}
.wel .x{position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:10px;color:var(--t3);display:flex;align-items:center;justify-content:center;font-size:20px}
.wel h2{font-size:20px;line-height:1.5}.wel p{font-size:14px;color:var(--t2);margin-top:2px}
.wprog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--t2)}.wprog .meter{flex:1;height:5px}
.steps{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.desk .steps{flex-direction:row}
.stp{flex:1;display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid var(--bd);text-align:right;min-width:0}
.stp .num{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:1.5px solid var(--bd2);color:var(--t2)}
.stp b{font-size:14px;display:block}.stp small{font-size:12px;color:var(--t3);display:block;margin-top:1px}
.stp .go{margin-right:auto;color:var(--t3);font-size:20px}
.stp.done{background:rgba(62,207,122,.06);border-color:rgba(62,207,122,.2)}.stp.done .num{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:16px}.stp.done b{color:var(--t2)}
.stp.next{border-color:rgba(62,207,122,.45)}.stp.next .num{border-color:var(--accent);color:var(--accent)}
.wdone{display:flex;align-items:center;gap:12px}
.wdone .big{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}

/* صفحة البند */
.sechead{display:flex;align-items:center;gap:12px}
.sechead h1{font-size:20px;line-height:1.4}
.sechead .tile{width:46px;height:46px;font-size:20px}
.secsum{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--t3)}
.secsum .meter{flex:1}
.ind{border-radius:var(--r-md);background:var(--s1);border:1px solid var(--bd);overflow:hidden}
.ind.cst{border-style:dashed;border-color:rgba(255,255,255,.16)}
.ih{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ih .st{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;border:1.5px solid var(--idle);color:var(--t3)}
.ih .st.p{border-color:var(--prog);color:var(--prog)}.ih .st.g{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}.ih .st.x{border-color:var(--gold);background:var(--gold);color:#2b2105}
.ih b{font-size:14px;display:block;line-height:1.5}.ih small{font-size:12px;color:var(--t3)}
.ih .acts{margin-right:auto;display:flex;gap:6px;flex-shrink:0}
.plus{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--accent);position:relative;flex-shrink:0}
.plus.pulse::before{content:"";position:absolute;inset:-5px;border-radius:16px;border:2px solid var(--accent);animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(.9)}100%{opacity:0;transform:scale(1.25)}}
.evs{border-top:1px solid var(--bd)}
.ev{display:flex;align-items:center;gap:10px;padding:10px 14px}
.ev+.ev{border-top:1px solid rgba(255,255,255,.04)}
.ev .ti2{width:32px;height:32px;border-radius:10px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--t2);flex-shrink:0}
.ev b{font-size:14px;display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{font-size:12px;color:var(--t3);display:flex;gap:6px;align-items:center}
.ev .star{color:var(--gold)}
.ev.new{animation:flash 1.6s ease}
@keyframes flash{0%{background:rgba(62,207,122,.18)}100%{background:transparent}}
.addind{width:100%;padding:13px;border-radius:var(--r-md);border:1.5px dashed var(--bd2);color:var(--t2);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
.cform{padding:14px;border-radius:var(--r-md);background:var(--s1);border:1px solid rgba(62,207,122,.35)}
.cform .err{font-size:12px;color:var(--danger);margin-top:6px}
.inp{width:100%;height:44px;border-radius:10px;border:1px solid var(--bd2);background:var(--bg);padding:0 12px;font-size:14px;outline:none}
.inp:focus{border-color:var(--accent)}.inp.bad{border-color:var(--danger)}
textarea.inp{height:88px;padding:10px 12px;resize:none;line-height:1.7}
.menu{position:absolute;z-index:25;min-width:210px;background:var(--s2);border:1px solid var(--bd2);border-radius:16px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.5);animation:fade .15s}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:10px;font-size:14px;text-align:right}
.menu button:hover{background:rgba(255,255,255,.05)}
.menu button.d{color:var(--danger)}
.aibox{padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(62,207,122,.08),rgba(217,180,74,.05));border:1px solid rgba(62,207,122,.2);font-size:14px;color:var(--t2);line-height:1.8}
.aibox b{color:var(--t1);display:flex;gap:6px;align-items:center;font-size:14px;margin-bottom:2px}

/* الأوراق والنوافذ */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;animation:fadeo .2s}
.sheet{position:absolute;z-index:21;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--s1);border-radius:24px 24px 0 0;border-top:1px solid var(--bd2);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.desk .sheet{left:50%;right:auto;bottom:auto;top:50%;width:520px;max-height:86%;transform:translate(-50%,-50%);border-radius:24px;border:1px solid var(--bd2);animation:fade .2s}
@keyframes up{from{transform:translateY(100%)}}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 18px 10px}
.sheet .sh h3{font-size:16px;flex:1}
.grab{width:40px;height:4px;border-radius:999px;background:var(--bd2);margin:8px auto 0}.desk .grab{display:none}
.sheet .sb{padding:4px 18px 16px;overflow-y:auto;scrollbar-width:none;flex:1}
.sheet .sf{padding:12px 18px 18px;border-top:1px solid var(--bd);display:flex;gap:8px}
.sheet .sf .btn{flex:1}
.modal{position:absolute;z-index:23;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 28px));background:var(--s1);border:1px solid var(--bd2);border-radius:24px;padding:18px;animation:fade .2s}
.modal h3{font-size:16px;display:flex;gap:8px;align-items:center}
.modal p{font-size:14px;color:var(--t2);line-height:1.8;margin-top:8px}
.modal .ma{display:flex;gap:8px;margin-top:16px}.modal .ma .btn{flex:1}
.fld{margin-top:14px}
.fld>label,.fld>.fl{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:7px}
.fld>label small,.fld>.fl small{font-weight:400;color:var(--t3);font-size:12px}
.fld .err{font-size:12px;color:var(--danger);margin-top:6px;display:flex;gap:5px;align-items:center}
.ctx{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--s2);border:1px solid var(--bd)}
.ctx b{font-size:14px;display:block}.ctx small{font-size:12px;color:var(--t3)}
.ctx .btn{margin-right:auto}
.types{display:flex;gap:6px;flex-wrap:wrap}
.types button{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--bd2);font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--t2)}
.types button.on{background:var(--t1);color:var(--bg);border-color:var(--t1)}
.drop{border:1.5px dashed var(--bd2);border-radius:16px;padding:18px;text-align:center;font-size:14px;color:var(--t3)}
.drop .btn{margin-top:8px}
.picked{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--s2);border:1px solid var(--bd)}

 ${needFile?`<div class="fld"><div class="fl">المرفق</div>${F.file?`<div class="picked"><span class="th" style="background:${VIS[2]}"><i class="ti ${TI[F.type]}"></i></span><div style="min-width:0;flex:1"><b>${esc(F.file)}</b><small>${F.type==='image'?'1.8MB':F.type==='video'?'24MB':'640KB'}</small></div><button class="icb sm" onclick="F.file=null;renderOv()"><i class="ti ti-x"></i></button></div>`:`<div class="drop ${F.err.file?'':''}" style="${F.err.file?'border-color:var(--danger)':''}"><i class="ti ${TI[F.type]}"></i><div>${F.type==='image'?'JPG · PNG · WEBP · حتى 10MB':F.type==='video'?'MP4 · MOV · حتى 50MB':'PDF · Word · حتى 10MB'}</div><button class="btn sm" onclick="pickFile()"><i class="ti ti-upload"></i>اختر ${TL[F.type]==='PDF'?'ملفاً':TL[F.type]}</button></div>${F.err.file?`<div class="err"><i class="ti ti-alert-circle"></i>${F.err.file}</div>`:''}`}

 let el,ti,bo;if(TIP==='plus'){el=$('plus-'+IND[SECS[0].id][0].id);ti='أضف شاهداً من هنا';bo='كل مؤشر له زر «+» خاص. اختر المؤشر ثم ارفع الصورة أو الملف.'}

 if(!el)return;const r=el.getBoundingClientRect();if(r.bottom<ar.top+50||r.top>ar.bottom)return;
 const w=240;let left=Math.max(10,Math.min(r.left-ar.left-8,ar.width-w-10)),top=r.bottom-ar.top+12,up=false;if(top+130>ar.height){top=r.top-ar.top-138;up=true}

 if(!ONB.tipBell)TIP='bell';ann={t:'',b:'',c:'upd'};rerender();toast('نُشر. افتح شاشة «المعلم» لترى الجرس')}
function adFeatures(){return `<div class="aph"><h1>الميزات</h1><p>كل الميزات من جدول feature_flags. جرّب إيقاف «الاستيراد من رابط» ثم افتح نموذج الإضافة عند المعلم</p></div><div class="card" style="margin-top:14px">${FLAGS.map(f=>`<div class="frow"><div><b>${f.t} ${f.ai?'<span class="pill i">تستهلك حصة AI</span>':''}</b><small>${f.d} · <span dir="ltr">${f.k}</span></small></div><div class="tog ${f.on?'on':''}" onclick="togFlag('${f.k}')"><span class="sw"></span></div></div>`).join('')}</div>`}
function togFlag(k){const f=FLAGS.find(x=>x.k===k);f.on=!f.on;LOG.unshift({at:'2026-09-26 10:10',ic:'ti-toggle-right',t:`${f.on?'تفعيل':'إيقاف'} «${f.t}» لكل المعلمين`});rerender();toast(f.on?'فُعّلت لكل المعلمين':'أُوقفت لكل المعلمين')}
function adLog(){return `<div class="aph"><h1>السجل</h1><p>كل إجراء إداري يُسجَّل تلقائياً (جدول admin_audit_log)</p></div><div class="card" style="margin-top:14px">${LOG.map(l=>`<div class="log"><span class="li"><i class="ti ${l.ic}"></i></span><div>${esc(l.t)}<small>عبدالعزيز · ${l.at}</small></div></div>`).join('')}</div>`}

/* ===================== البدء ===================== */
seg('cView',view,v=>{view=v;shell();go(route,{fromTeacher})});
seg('cAcc',acc,v=>{acc=v;boot()});
seg('cNet',net,v=>{net=v;if(route==='teacher')boot(false)});
seg('cRoute',route,v=>{fromTeacher=false;go(v)});
boot();hydrate(document);
</script>
